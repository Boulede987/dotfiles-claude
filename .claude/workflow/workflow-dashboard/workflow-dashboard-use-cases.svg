<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="966px" preserveAspectRatio="none" style="width:961px;height:966px;background:#FFFFFF;" version="1.1" viewBox="0 0 961 966" width="961px" zoomAndPan="magnify"><defs/><g><!--cluster workflow-dashboard (standalone process, per project)--><g id="cluster_workflow-dashboard (standalone process, per project)"><rect fill="none" height="649" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="837" x="118" y="178.5"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="382" x="345.5" y="195.0332">workflow-dashboard (standalone process, per project)</text></g><g id="elem_UC1"><ellipse cx="292.6102" cy="242.4034" fill="#F1F1F1" rx="83.6102" ry="27.9034" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="102" x="241.6102" y="237.3272">Start dashboard</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76" x="254.6102" y="254.9366">for a project</text></g><g id="elem_UC2"><ellipse cx="787.685" cy="751.3775" fill="#FFF3B0" rx="136.185" ry="59.3775" style="stroke:#C99A00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="41" x="767.185" y="711.0826">&#171;new&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177" x="699.185" y="728.692">Switch between feature tabs</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196" x="689.685" y="746.3013">(ongoing features; closed ones</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171" x="702.185" y="763.9107">in a Closed tab; marker dot</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157" x="709.185" y="781.5201">when awaiting validation)</text></g><g id="elem_UC3"><ellipse cx="292.6629" cy="459.6477" fill="#FFF3B0" rx="149.6629" ry="47.1477" style="stroke:#C99A00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="41" x="267.0452" y="430.2881">&#171;new&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176" x="199.5452" y="447.8974">Read documents to validate</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133" x="221.0452" y="465.5068">in the To validate tab</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="222" x="176.5452" y="483.1162">(newest entry = awaiting-validation)</text></g><g id="elem_UC4"><ellipse cx="787.5409" cy="459.647" fill="#FFF3B0" rx="151.5409" ry="47.147" style="stroke:#C99A00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="41" x="761.898" y="430.2722">&#171;new&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179" x="692.898" y="447.8816">See each document in place</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200" x="682.398" y="465.4909">(images inline, text as plain text,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225" x="669.898" y="483.1003">reason when unshowable; link kept)</text></g><g id="elem_UC5"><ellipse cx="292.5635" cy="582.3551" fill="#F1F1F1" rx="158.5635" ry="40.3551" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147" x="219.0635" y="568.4743">Browse feature timeline</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208" x="188.5635" y="586.0836">(increment &gt; phase, gate, status,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144" x="220.5635" y="603.693">override, commit hash)</text></g><g id="elem_UC6"><ellipse cx="292.398" cy="689.6796" fill="#F1F1F1" rx="143.898" ry="31.1796" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187" x="198.898" y="684.6034">Check requirements progress</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208" x="188.398" y="702.2128">(NEEDS.md section 2, collapsed)</text></g><g id="elem_UC7"><ellipse cx="292.6457" cy="783.4034" fill="#F1F1F1" rx="87.1457" ry="27.9034" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107" x="239.1457" y="778.3272">See parse errors</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71" x="257.1457" y="795.9366">in the page</text></g><g id="elem_UC8"><ellipse cx="292.2701" cy="341.5099" fill="#FFF3B0" rx="113.7701" ry="35.5099" style="stroke:#C99A00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="41" x="258.5267" y="324.6545">&#171;new&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168" x="195.0267" y="342.2639">Refresh live on file change</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118" x="220.0267" y="359.8732">(selected tab kept)</text></g><!--entity dev--><g id="elem_dev"><ellipse cx="38.5" cy="552" fill